name: Deploy to Raspberry Pi

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create required directories
        run: |
          mkdir -p models/trained
          mkdir -p logs
          sudo mkdir -p /home/admin123/cat_detections
        continue-on-error: true

      # Variante A: non-secret runtime config (config.env) is committed and
      # arrives via checkout automatically. Only the real secrets are read
      # here from GitHub and written to the gitignored .env file.
      - name: Create .env from secrets
        run: |
          cat > .env <<'EOF'
          RTSP_URL=${{ secrets.RTSP_URL }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          EOF
          chmod 600 .env

      - name: Stop existing container
        run: |
          docker compose down || true
        continue-on-error: true

      - name: Build Docker image
        run: |
          docker build -t cat-detector:latest .

      # docker compose reads config.env (committed) + .env (from step above)
      - name: Start container
        run: |
          docker compose up -d

      - name: Wait for container to start
        run: |
          sleep 5

      - name: Check container status
        run: |
          docker ps | grep cat_detector
          echo "--- Container Logs ---"
          docker logs cat_detector --tail 50

      - name: Cleanup old images
        run: |
          docker image prune -f

      - name: Deployment summary
        run: |
          echo "Deployment completed successfully!"
          echo "Container: cat_detector"
          echo "Status: $(docker inspect -f '{{.State.Status}}' cat_detector)"
          echo "Started at: $(docker inspect -f '{{.State.StartedAt}}' cat_detector)"
